<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceria Keluarga</title>
<style>
:root{--bg1:#ffe1f0;--bg2:#d6ecff;--card:#ffffffd9;--ink:#2d2a4a;--sub:#6b6890;--p:#7c5cff;--p2:#ff6fae;--ok:#2fbf71;--bad:#ff5d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a3a;--bg2:#13233d;--card:#25223fd9;--ink:#f1efff;--sub:#b5b1d8}}
:root[data-theme="dark"]{--bg1:#2a1a3a;--bg2:#13233d;--card:#25223fd9;--ink:#f1efff;--sub:#b5b1d8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.bubbles span{position:fixed;bottom:-60px;border-radius:50%;background:#ffffff66;animation:rise linear infinite;z-index:0}
@keyframes rise{to{transform:translateY(-110vh) rotate(90deg)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;margin:6px 0;text-align:center;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:6px 0 12px;text-align:center}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:20px;box-shadow:0 10px 30px #7c5cff26;margin:14px 0;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.hero{font-size:72px;text-align:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
p.sub{color:var(--sub);text-align:center;margin:4px 0 12px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select{width:100%;padding:14px;border-radius:16px;border:2px solid #7c5cff44;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--p)}
.roles{display:flex;gap:8px;margin-bottom:8px}
.roles button{flex:1;padding:10px 4px;font-size:14px}
button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 18px;cursor:pointer;color:var(--ink);background:#7c5cff22;transition:transform .15s}
button:active{transform:scale(.95)}
button.on,.main-btn{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}
.main-btn{width:100%;font-size:18px;margin-top:16px;box-shadow:0 8px 18px #ff6fae55}
.err{color:var(--bad);font-weight:700;min-height:20px;text-align:center;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:22px 8px;border-radius:24px;color:#fff;font-size:17px;text-align:center;box-shadow:0 8px 20px #0002}
.tile b{display:block;font-size:44px;animation:bob 3s ease-in-out infinite}
.t1{background:linear-gradient(135deg,#7c5cff,#a58bff)}.t2{background:linear-gradient(135deg,#ff6fae,#ff9ac6)}
.t3{background:linear-gradient(135deg,#ffb020,#ffd35c)}.t4{background:linear-gradient(135deg,#1fb6a6,#5fe0c8)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:16px;background:#7c5cff1a}
.opt.good{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.bar{height:10px;border-radius:9px;background:#7c5cff22;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .4s}
.big{font-size:20px;line-height:1.5;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
.back{background:none;padding:6px 4px;color:var(--sub)}
.row{display:flex;gap:10px}.row button{flex:1}
.stage{height:190px;border-radius:20px;position:relative;overflow:hidden;margin-bottom:12px}
.stage .a{position:absolute;font-size:60px;line-height:1}
.sky{background:linear-gradient(#8fd3ff,#d8f4ff)}.river{background:linear-gradient(#8fd3ff 0 45%,#3b9fe0 45%)}.night{background:linear-gradient(#2c2a6e,#6a5acd)}.grass{background:linear-gradient(#bfe9ff 0 55%,#7ed48a 55%)}
.hop{animation:hop 1.1s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-26px)}}
.swim{animation:swim 3.5s ease-in-out infinite alternate}@keyframes swim{to{transform:translateX(70px)}}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 1.2s ease-in-out infinite alternate}@keyframes tw{to{opacity:.3;transform:scale(.7)}}
.rk{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #7c5cff22}
.small{font-size:13px;color:var(--sub);text-align:center}
.lesson{background:#2fbf7122;border:2px dashed var(--ok);border-radius:16px;padding:10px 12px;text-align:center;font-weight:700;margin-top:10px}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.xo button{font-size:36px;height:90px;padding:0;background:#7c5cff1a}
.ld{display:flex;gap:4px;margin:8px 0}.ld i{flex:1;height:8px;border-radius:5px;background:#7c5cff22}.ld i.d{background:var(--ok)}.ld i.c{background:var(--p2)}
</style>
</head>
<body>
<div class="bubbles" id="bub"></div>
<main id="app"></main>
<script>
(function(){
var SHEET_URL="https://script.google.com/macros/s/AKfycbw7bD2zA5UTZ9Y77hh_vU41x5BWZLFGgJNhobJbedSMmeN-w0RHj6ssep8l3k2iS6sL/exec";
var ALLQ=[
{q:"Apakah ibu negara Malaysia?",o:["Johor Bahru","Kuala Lumpur","Ipoh","Kota Kinabalu"],a:1},

{q:"Gunung tertinggi di Malaysia ialah?",o:["Gunung Tahan","Gunung Kinabalu","Gunung Ledang","Gunung Jerai"],a:1},
{q:"Warna apakah terhasil jika biru dicampur kuning?",o:["Jingga","Ungu","Hijau","Merah"],a:2},

{q:"Bahagian badan manakah mengepam darah?",o:["Paru-paru","Perut","Otak","Jantung"],a:3},

{q:"Haiwan terbesar di dunia ialah?",o:["Gajah","Jerung putih","Ikan paus biru","Jerapah"],a:2},
{q:"Haiwan manakah dikenali sebagai raja rimba?",o:["Harimau kumbang","Singa","Beruang","Serigala"],a:1}];
var QUIZ=ALLQ.slice(0,8),POOL=ALLQ;
var IQ=[
{q:"Nombor seterusnya? 2, 4, 8, 16, ?",o:["24","30","32","64"],a:2,e:"Setiap nombor didarab 2."},
{q:"Ahmad lebih tinggi daripada Ali. Ali lebih tinggi daripada Siti. Siapa paling pendek?",o:["Ahmad","Ali","Siti","Sama sahaja"],a:2,e:"Susunan: Ahmad > Ali > Siti."},
{q:"3 kucing tangkap 3 tikus dalam 3 minit. Berapa minit untuk 100 kucing tangkap 100 tikus?",o:["3","33","100","300"],a:0,e:"Setiap kucing menangkap 1 tikus dalam 3 minit."},
{q:"Nombor seterusnya? 1, 1, 2, 3, 5, 8, ?",o:["11","12","13","14"],a:2,e:"Tambah dua nombor sebelumnya."},
{q:"Aku ada bandar tetapi tiada rumah, ada sungai tetapi tiada air. Apakah aku?",o:["Peta","Mimpi","Lukisan","Buku"],a:0,e:"Peta menunjukkan bandar dan sungai, tetapi bukan yang sebenar."},
{q:"Apakah yang makin dikongsi, makin bertambah?",o:["Duit","Ilmu","Makanan","Air"],a:1,e:"Ilmu bertambah bila dikongsi."},
{q:"Hari ini Isnin. Apakah hari 3 hari selepas lusa?",o:["Jumaat","Sabtu","Ahad","Khamis"],a:1,e:"Lusa ialah Rabu, tambah 3 hari menjadi Sabtu."},
{q:"Mana satu yang berbeza? 🍎 🍌 🍇 🚗",o:["🍎","🍌","🍇","🚗"],a:3,e:"Tiga lagi ialah buah-buahan."},
{q:"Kamu berlumba lari dan memintas orang yang di tempat ke-2. Kamu di tempat ke berapa sekarang? 🏃",o:["1","2","3","Terbang"],a:1,e:"Kamu ambil tempat orang itu, jadi kamu ke-2. Bukan nombor 1 ya! 😄"},
{q:"Pak Mat ada 3 anak perempuan. Setiap anak perempuan ada seorang abang. Berapa anak Pak Mat?",o:["3","4","6","7"],a:1,e:"Abang mereka sama orang, jadi 3 + 1 = 4. Abang pun kena kongsi! 😂"},
{q:"Apa yang ada 4 kaki tetapi tidak boleh berjalan, dan tak pernah penat?",o:["Kucing tidur","Meja","Katil bunga","Kura-kura"],a:1,e:"Meja! Dia berdiri sepanjang hari tanpa mengeluh. 🪑"},
{q:"Apa yang ada banyak kunci tetapi tak boleh buka pintu?",o:["Piano","Rantai","Pintu","Poket"],a:0,e:"Piano ada kunci not, bukan kunci pintu. 🎹"},
{q:"Katak jatuh ke perigi 5 meter. Setiap hari melompat naik 3m, malam tergelincir turun 2m. Hari ke berapa katak keluar? 🐸",o:["Hari ke-2","Hari ke-3","Hari ke-4","Hari ke-5"],a:1,e:"Hari 1: 3 → 1. Hari 2: 4 → 2. Hari 3: 5 sampai! Tak sempat tergelincir."},
{q:"Mana lebih berat: 1 kg kapas atau 1 kg besi?",o:["Besi","Kapas","Sama berat","Tergantung cuaca"],a:2,e:"Dua-dua 1 kg. Cuma kapas lebih berkembang! 🧶"},
{q:"Berapa bulan ada 28 hari?",o:["1","2","6","12"],a:3,e:"Semua bulan ada sekurang-kurangnya 28 hari! 📅"},
{q:"Ayam jantan bertelur di atas bumbung condong. Telur jatuh ke arah mana? 🐓",o:["Kiri","Kanan","Depan","Ayam jantan tak bertelur"],a:3,e:"Soalan helah! Ayam jantan tidak bertelur. 🥚"}];
var ADABQ=[
{q:"Apakah yang kita baca sebelum makan?",o:["Bismillah","Alhamdulillah","Subhanallah","Astaghfirullah"],a:0,e:"Bismillah sebelum makan mengundang keberkatan."},
{q:"Kita makan dan minum menggunakan tangan yang mana?",o:["Kiri","Kanan","Mana-mana","Kedua-duanya"],a:1,e:"Rasulullah SAW menggalakkan tangan kanan untuk makan dan minum."},
{q:"Apa jawapan bila orang memberi salam Assalamualaikum?",o:["Terima kasih","Waalaikumussalam","Selamat pagi","Hai"],a:1,e:"Menjawab salam hukumnya wajib."},
{q:"Siapakah yang paling utama kita layan dengan baik?",o:["Kawan","Jiran","Ibu","Cikgu"],a:2,e:"Dalam hadis, ibu disebut tiga kali, kemudian bapa."},
{q:"Apa yang kita ucapkan selepas makan?",o:["Bismillah","Alhamdulillah","Wah sedapnya","Tak apa"],a:1,e:"Kita bersyukur kepada Allah atas rezeki."},
{q:"Jika kita melukakan hati kawan, apa yang patut dibuat?",o:["Diamkan diri","Minta maaf","Marah balik","Lari"],a:1,e:"Meminta maaf dan memaafkan ialah akhlak mulia."},
{q:"Berapa kali solat fardu dalam sehari semalam?",o:["3","4","5","6"],a:2,e:"Subuh, Zohor, Asar, Maghrib dan Isyak."},
{q:"Sifat Nabi yang bermaksud benar ialah?",o:["Amanah","Siddiq","Tabligh","Fatanah"],a:1,e:"Siddiq benar, Amanah dipercayai, Tabligh menyampaikan, Fatanah bijaksana."},
{q:"Apa yang kita ucapkan bila bersin?",o:["Alhamdulillah","Bismillah","Allahu Akbar","Wah!"],a:0,e:"Orang yang bersin ucap Alhamdulillah, kawannya jawab Yarhamukallah."},
{q:"Jika kita terjumpa dompet orang di jalan, apa yang patut dibuat?",o:["Ambil duit","Pulangkan kepada pemiliknya","Biarkan","Simpan"],a:1,e:"Amanah dan jujur itu sifat orang beriman."},
{q:"Surah pertama dalam Al-Quran ialah?",o:["Al-Ikhlas","An-Nas","Al-Fatihah","Al-Baqarah"],a:2,e:"Al-Fatihah dibaca dalam setiap rakaat solat."},
{q:"Apabila orang tua masuk ke dalam bilik, apa yang elok kita buat?",o:["Terus main game","Bangun dan hormati","Buat tak tahu","Lari"],a:1,e:"Menghormati orang tua ialah adab yang disukai Allah."},
{q:"Bila kita mahu masuk ke rumah orang, apa yang patut dilakukan dahulu?",o:["Terus masuk","Beri salam dan minta izin","Menjerit","Ketuk jendela"],a:1,e:"Beri salam dan minta izin, sesuai dengan ajaran Islam."}];

var ASK=["Apa perkara paling lucu yang pernah berlaku kepada kita?","Jika boleh ada kuasa luar biasa, kamu pilih kuasa apa?","Apa makanan kegemaran keluarga kita, dan kenapa?","Siapakah wira kamu, dan apa yang kamu kagumi?","Ke mana kita nak bercuti jika tiada had belanja?","Apa satu perkara baik yang kamu buat hari ini?","Apa cita-cita kamu bila dewasa nanti?","Apa satu perkara yang ibu bapa boleh buat supaya kamu lebih gembira?","Siapa yang paling kamu rasa nak ucap terima kasih hari ini, dan kenapa?","Apa doa yang kamu mahu keluarga kita sentiasa baca bersama?","Kalau kamu jadi ketua keluarga sehari, apa peraturan pertama kamu?","Apa kisah Nabi atau sahabat yang paling kamu suka, dan apa yang kita boleh belajar?"];
var JOKE=["Apa yang ada kepala dan ekor tetapi tiada badan? Duit syiling! 🪙","Cikgu: 5 burung di pokok, tembak 1, tinggal berapa? Murid: Kosong cikgu, yang lain terbang! 🐦","Kenapa Ali bawa tangga ke sekolah? Sebab nak naik kelas! 🪜","Doktor: Kurangkan main telefon. Pesakit: Tapi doktor, saya baca nasihat ini di telefon! 📱","Apa yang makin basah bila mengeringkan? Tuala! 🧺","Cikgu: Kenapa kamu lambat? Murid: Ada papan tanda, Sekolah di depan, perlahan-lahan! 😅","Kenapa buku matematik sedih? Sebab ada terlalu banyak masalah! 📚","Apa beza kucing dan komputer? Dua-dua ada tetikus, tapi kucing sahaja yang makan! 🐱","Ibu: Kenapa bilik berselerak? Anak: Itu bukan selerak, itu seni moden! 🎨","Apa yang naik tapi tak pernah turun? Umur! 🎂","Kenapa ikan tak pernah lewat ke sekolah? Sebab mereka sentiasa berenang bersama arus masa! 🐟","Kenapa ayam menyeberang jalan? Nak tunjuk dia bukan penakut, cuma lapar! 🐔","Apa jadi kalau hantu masuk lif? Dia naik semangat! 👻","Ayah: Kenapa nilai ujian kamu rendah? Anak: Sebab soalan susah, ayah, saya cuma jawab yang senang. 😆","Apa bunyi bila durian jatuh atas kepala? Aduh, tapi sedap! 😂"];
var STORY=[
{c:"sky",t:"Pada suatu hari, Sang Kancil kehausan. Sungai di seberang penuh dengan buah-buahan, tetapi sungai itu dijaga buaya yang lapar.",s:'<div class="a hop" style="left:20%;bottom:28px">🦌</div><div class="a twinkle" style="right:12%;top:14px">☀️</div><div class="a" style="right:18%;bottom:24px">🍎</div>'},
{c:"river",t:"Kancil berpura-pura: Raja menyuruh saya mengira semua buaya! Berbaris ya, dari tebing ke tebing!",s:'<div class="a swim" style="left:10%;top:72px">🐊</div><div class="a swim" style="left:30%;top:100px;animation-delay:.5s">🐊</div><div class="a hop" style="left:8%;top:6px">🦌</div>'},
{c:"grass",t:"Buaya-buaya pun berbaris. Kancil melompat di atas belakang mereka sambil mengira, satu, dua, tiga... sampai ke seberang!",s:'<div class="a hop" style="left:55%;top:60px">🦌</div><div class="a" style="left:12%;top:105px">🐊🐊🐊</div><div class="a twinkle" style="right:8%;top:10px">⭐</div>'},
{c:"night",t:"Kancil makan buah sehingga kenyang. Pengajarannya, kebijaksanaan lebih hebat daripada kekuatan. Tamat! 🌙",s:'<div class="a spin" style="right:12%;top:12px">🌕</div><div class="a hop" style="left:38%;bottom:20px">🦌</div><div class="a twinkle" style="left:10%;top:20px">✨</div><div class="a twinkle" style="left:70%;top:80px">✨</div>',l:"Kebijaksanaan lebih hebat daripada kekuatan."}];

var app=document.getElementById("app"),P=null,score=0,qi=0,si=0,raf=0,tm=0;
var bub=document.getElementById("bub");
for(var i=0;i<14;i++){var b=document.createElement("span"),z=20+Math.random()*60;b.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(14+Math.random()*16)+"s;animation-delay:-"+Math.random()*20+"s";bub.appendChild(b)}

function h(html){app.innerHTML=html;window.scrollTo(0,0)}
function $(id){return document.getElementById(id)}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function total(){var t=0;for(var k in P.sc)t+=P.sc[k];return t}
function addScore(k,v){if(v>(P.sc[k]||0))P.sc[k]=v;save()}
function save(){
 if(!P)return;var d={name:P.name,phone:P.phone,peranan:P.role,keluarga:P.fam,sc:P.sc,masa:new Date().toISOString()};
 try{localStorage.setItem("ck",JSON.stringify(d))}catch(e){}
 if(SHEET_URL.indexOf("http")===0){try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).catch(function(){})}catch(e){}}
}
function reg(){
 var role="Kanak-kanak";
 h('<div class="hero">🦄</div><h1>Ceria Keluarga</h1><p class="sub">Kuiz, game, lawak dan kisah untuk kanak-kanak, remaja dan ibu bapa</p>'+
 '<div class="card"><label>Nama kamu</label><input id="nm" placeholder="Contoh: Aisyah" maxlength="40" autocomplete="name">'+
 '<label>No. telefon</label><input id="ph" type="tel" inputmode="tel" placeholder="Contoh: 0123456789" maxlength="15" autocomplete="tel">'+
 '<label>Nama keluarga (pilihan, untuk ranking keluarga)</label><input id="fm" placeholder="Contoh: Keluarga Ahmad" maxlength="25">'+
 '<label>Saya seorang</label><div class="roles" id="rl"><button class="on">Kanak-kanak</button><button>Remaja</button><button>Ibu bapa</button></div>'+
 '<div class="err" id="er"></div><button class="main-btn" id="go">Mula Bermain 🚀</button></div>');
 var rs=$("rl").children;
 [].forEach.call(rs,function(b){b.onclick=function(){[].forEach.call(rs,function(x){x.className=""});b.className="on";role=b.textContent}});
 $("go").onclick=function(){
  var n=$("nm").value.trim(),p=$("ph").value.replace(/[\s-]/g,"");
  if(n.length<2){$("er").textContent="Sila isi nama dahulu ya 😊";return}
  if(!/^\+?\d{9,13}$/.test(p)){$("er").textContent="No. telefon tidak sah. Contoh: 0123456789";return}
  P={name:n,phone:p,role:role,fam:$("fm").value.trim(),sc:{}};
  try{var o=JSON.parse(localStorage.getItem("ck")||"null");if(o&&o.phone===p&&o.sc)P.sc=o.sc}catch(e){}
  save();home();
 };
}
function home(){
 var T=[["🧠","Kuiz",function(){POOL=ALLQ;quiz(0)}],["🧩","Kuiz IQ Lucu",function(){POOL=IQ;quiz(0)}],["🕌","Adab & Agama",function(){POOL=ADABQ;quiz(0)}],["🎮","Game",gameMenu],["💬","Soalan Keluarga",ask],["😂","Lawak",joke],["📖","Kisah",storyMenu],["🏆","Ranking",rank]];
 h('<div class="hero">🎈</div><h1>Hai, <span id="hn"></span>!</h1><p class="sub">Mata anda: <b id="pt"></b></p><div class="grid" id="gd"></div>');
 $("hn").textContent=P.name;$("pt").textContent=total();
 T.forEach(function(x,i){var b=document.createElement("button");b.className="tile t"+(i%4+1);b.innerHTML="<b></b>";b.firstChild.textContent=x[0];b.appendChild(document.createTextNode(x[1]));b.onclick=x[2];$("gd").appendChild(b)});
}
function back(){return '<button class="back" id="bk">← Menu</button>'}
function wireBack(){$("bk").onclick=function(){cancelAnimationFrame(raf);raf=-1;clearInterval(tm);home()}}

function quiz(n){
 var K=POOL===IQ?"iq":POOL===ADABQ?"adab":"quiz";
 if(n===0){qi=0;score=0;QUIZ=shuffle(POOL).slice(0,8)}
 if(qi>=QUIZ.length){
  addScore(K,score*5);
  var e=score>=7?"🏆 Hebat sekali!":score>=4?"🌟 Bagus!":"💪 Cuba lagi!";
  h(back()+'<div class="card"><div class="hero">'+e.split(" ")[0]+'</div><h2>'+e.split(" ").slice(1).join(" ")+'</h2><p class="sub">Skor kamu: '+score+' / '+QUIZ.length+'</p><button class="main-btn" id="ag">Main Lagi</button></div>');
  wireBack();$("ag").onclick=function(){quiz(0)};return;
 }
